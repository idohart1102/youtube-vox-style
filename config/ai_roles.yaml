# Phân công AI. Đổi AI cho một vai trò: sửa dòng tại đây. Hướng dẫn vai trò đọc được bằng mọi AI ở core/roles/<vai-trò>.md.
# Máy này: tạo ảnh và chấm dùng 9router. Máy khác không có 9router: việc chấm chuyển sang Codex, việc tạo ảnh cần dịch vụ tương thích (xem docs/handover.md).
models:
  claude: claude-opus-5-5
  9router_text: cx/gpt-6.1-sol
  9router_image: cx/gpt-image-2.5
roles:
  orchestrator: {ai: claude, backup: codex, does: "Điều phối, cập nhật status.yaml, báo Sếp"}
  researcher:   {ai: claude, backup: codex, does: "Nghiên cứu kênh và đề tài, dùng vidIQ"}
  writer:       {ai: claude, backup: codex, does: "Brief, kịch bản, meta nháp. Viết theo channels/<slug>/script/"}
  reviewer:     {ai: 9router_text, backup: codex, does: "Chấm kịch bản độc lập, kiểm tra fact"}
  builder:      {ai: claude, backup: codex, does: "asset_plan.json, scenes.json, chọn rig"}
  image:        {ai: 9router_image, backup: none, does: "Tạo ảnh qua gen_assets.py"}
  qc-asset:     {ai: 9router_text, backup: codex, does: "Chấm ảnh, tìm ảnh thật, tối đa 5 lần qua gen_assets.py"}
  qc-video:     {ai: 9router_text, backup: codex, does: "QC video độc lập qua qc_video.py"}
  packager:     {ai: claude, backup: codex, does: "Meta có mốc thời gian, thumbnail, danh sách đăng"}
  analyst:      {ai: claude, backup: codex, does: "Số liệu, learnings.md, knowledge/"}
scripts_no_ai: [align_srt, validate_scenes, render, render_check, publish_clean, status]
people:
  sep: "Gửi audio và srt, duyệt brief, quyết định render lại, chốt bản cuối, đăng YouTube"
